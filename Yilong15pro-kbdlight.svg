<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"
     viewBox="0 0 256 256">
  <defs>
    <!-- RGB 渐变：红 -> 绿 -> 蓝 -->
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff3b30"/>
      <stop offset="50%"  stop-color="#34c759"/>
      <stop offset="100%" stop-color="#0a84ff"/>
    </linearGradient>

    <!-- 整体柔光 -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- 底部发光 -->
  <g filter="url(#soft)" opacity="0.55">
    <rect x="28" y="176" width="200" height="16" rx="8" fill="url(#rgb)"/>
  </g>

  <!-- 键盘机身 -->
  <rect x="24" y="60" width="208" height="128" rx="16"
        fill="#2b2b31" stroke="#4a4a52" stroke-width="4"/>

  <!-- 键帽网格（4 行 x 6 列） -->
  <g fill="#5a5a64">
    <!-- 第 1 行：RGB 高亮 -->
    <rect x="40"  y="76"  width="24" height="20" rx="4" fill="url(#rgb)"/>
    <rect x="70"  y="76"  width="24" height="20" rx="4" fill="url(#rgb)" opacity="0.75"/>
    <rect x="100" y="76"  width="24" height="20" rx="4"/>
    <rect x="130" y="76"  width="24" height="20" rx="4"/>
    <rect x="160" y="76"  width="24" height="20" rx="4"/>
    <rect x="190" y="76"  width="26" height="20" rx="4"/>

    <!-- 第 2 行 -->
    <rect x="40"  y="102" width="24" height="20" rx="4"/>
    <rect x="70"  y="102" width="24" height="20" rx="4"/>
    <rect x="100" y="102" width="24" height="20" rx="4" fill="url(#rgb)" opacity="0.75"/>
    <rect x="130" y="102" width="24" height="20" rx="4"/>
    <rect x="160" y="102" width="24" height="20" rx="4"/>
    <rect x="190" y="102" width="26" height="20" rx="4"/>

    <!-- 第 3 行 -->
    <rect x="40"  y="128" width="24" height="20" rx="4"/>
    <rect x="70"  y="128" width="24" height="20" rx="4"/>
    <rect x="100" y="128" width="24" height="20" rx="4"/>
    <rect x="130" y="128" width="24" height="20" rx="4" fill="url(#rgb)"/>
    <rect x="160" y="128" width="24" height="20" rx="4"/>
    <rect x="190" y="128" width="26" height="20" rx="4"/>

    <!-- 空格行 -->
    <rect x="40"  y="154" width="36" height="20" rx="4"/>
    <rect x="82"  y="154" width="92" height="20" rx="4"/>
    <rect x="180" y="154" width="36" height="20" rx="4"/>
  </g>
</svg>
